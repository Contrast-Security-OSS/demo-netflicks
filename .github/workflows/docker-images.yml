name: Docker Image CI

on:
  push:
    branches: 
      - main
    tags: 
      - v*
  pull_request:
    branches: 
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-base:
    name: Docker Build Base (no-agent)
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      -
        name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      -
        name: Docker Setup QEMU
        uses: step-security/setup-qemu-action@109c6ed9f089be1a250c75fd6a534e30df44e030 # v4.0.0
        with:
          platforms: all
      -
        name: Docker Setup Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0
        with: 
          platforms: linux/amd64,linux/arm64
      - 
        name: Create cache for docker images for use in the next job
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: latest-no-agent
          path: ${{ runner.temp }}
      -
        name: Build and push Docker images
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with: 
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: contrastsecuritydemo/netflicks:latest-no-agent
          outputs: type=docker,dest=${{ runner.temp }}/latest-no-agent.tar


  
  build-contrast:
    name: Docker Build Contrast (agent)
    runs-on: ubuntu-latest
    needs: 
      - build-base
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      -
        name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      -
        name: Docker Setup QEMU
        uses: step-security/setup-qemu-action@109c6ed9f089be1a250c75fd6a534e30df44e030 # v4.0.0
        with:
          platforms: all
      -
        name: Docker Setup Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0
        with: 
          platforms: linux/amd64,linux/arm64
      -
        name: Create cache for docker images for use in the next job
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: latest
          path: ${{ runner.temp }}
      -
        name: Build and push Docker images
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with: 
          push: false
          load: true
          tags: contrastsecuritydemo/netflicks:latest
          outputs: type=docker,dest=${{ runner.temp }}/latest.tar


  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs:
      - build-base
      - build-contrast
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - 
        name: Restore cached docker images
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}
          key: latest-no-agent
      -
        name: Restore cached docker images
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}
          key: latest
      - 
        name: Load images
        run: |
          docker load --input ${{ runner.temp }}/latest-no-agent.tar
          docker load --input ${{ runner.temp }}/latest.tar
      -
        name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      -
        name: Run docker-compose tests
        run: | 
          docker compose up -d 
      - 
        name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      - 
        name: Install dependencies
        run: | 
          cd tests
          npm ci
          
      - 
        name: Install playwright browsers
        run: |
          cd tests
          npx playwright install --with-deps chromium
      - 
        name: Run Playwright tests
        run: |
          cd tests
          npx playwright test assess/*.spec.ts
      - 
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 30

  pre-merge:
    name: Prepare to merge
    runs-on: ubuntu-latest
    needs: 
      - test

    steps:              
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Docker Metadata action
        id: metadata    
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: contrastsecuritydemo/netflicks
          flavor: |
            latest=true
            suffix=agent
          tags: |
            type=semver,pattern={{version}}, priority=100
            type=semver,pattern={{major}}.{{minor}}, priority=200
          
      - name: Version number 
        run: |
          echo Getting the old build number
          echo $(echo ${{ steps.metadata.outputs.tags }})

          


  merge:
    name: Merge if PR is merged and tests pass
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    needs: 
      - test

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - run: |
          echo The PR was merged
