name: Docker Image CI

on:
  push:
    branches: 
      - main
    tags: 
      - v*
  pull_request:
    branches: 
      - main
  workflow_dispatch:

jobs:

  build:
    name: Build Multi-Stage Docker Images
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      metadata: ${{ steps.meta.outputs.json }}
      contrast_version: ${{ steps.versions.outputs.contrast_version }}
    steps:
      -
        name: Checkout branch
        uses: actions/checkout@v4
      - 
        name: Set up Docker daemon for multi-platform builds
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }
      -
        name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      -
        name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3
        with: 
          platforms: linux/amd64,linux/arm64
      -
        name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: contrastsecuritydemo/netflicks
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      -
        name: Build no-agent variant
        id: build
        uses: docker/build-push-action@v5
        with: 
          context: .
          platforms: linux/amd64, linux/arm64
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: runtime
          tags: |
            netflicks:latest-no-agent
      -
        name: Build image with Contrast agent
        id: build-contrast
        uses: docker/build-push-action@v5
        with: 
          context: .
          platforms: linux/amd64, linux/arm64
          push: false
          load: true
          cache-from: type=gha
          target: runtime-with-contrast
          tags: |
            netflicks:latest-with-agent
      -
        name: Run docker-compose tests
        run: | 
          docker compose --profile test up --build --abort-on-container-exit --exit-code-from tests 
      -
        name: Get currently installed Contrast agent version
        id: versions
        run: | 
          docker compose up web-dev -d
          docker compose cp web-dev:/opt/contrast/image-manifest.json image-manifest.json
          CONTRAST_VERSION=$(cat image-manifest.json | jq -r '.version')
          echo "contrast_version=${CONTRAST_VERSION}" >> $GITHUB_OUTPUT
          docker compose down
          echo "Contrast agent version: ${CONTRAST_VERSION}"

  pre-merge:
    name: Prepare to merge
    runs-on: ubuntu-latest
    needs: 
      - build
    steps:              
      - name: Docker Metadata action
        id: metadata    
        uses: docker/metadata-action@v5
        with:
          images: contrastsecuritydemo/netflicks
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}, priority=100
            type=semver,pattern={{major}}.{{minor}}, priority=200
          
      - name: Version number 
        run: |
          echo Getting the build metadata
          echo ${{ needs.build.outputs.contrast_version }}

