name: Docker Image CI

on:
  push:
    branches: 
      - main
    tags: 
      - v*
  pull_request:
    branches: 
      - main
  workflow_dispatch:

jobs:

  build:
    name: Build Multi-Stage Docker Images
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      metadata: ${{ steps.meta.outputs.json }}
    steps:
      -
        name: Checkout branch
        uses: actions/checkout@v4
      -
        name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      -
        name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3
        with: 
          platforms: linux/amd64,linux/arm64
      -
        name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: contrastsecuritydemo/netflicks
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      -
        name: Get agent version
        run: |
          # Get the agent version from the image-manifest.json file
          # Build a temporary container just to extract the version
          docker build --target runtime-with-contrast -t temp-contrast .
          CONTRAST_VERSION=$(docker run --rm temp-contrast cat /opt/contrast/image-manifest.json | jq -r '.version')
          echo "contrast_version=${CONTRAST_VERSION}" >> $GITHUB_OUTPUT
          docker rmi temp-contrast
          
          # CONTRAST_VERSION=$(cat /opt/contrast/image-manifest.json | grep --only-matching '"version": "[^"]*' | cut --delimiter='"' --fields=4)
          # echo "contrast_version=${CONTRAST_VERSION}" >> $GITHUB_OUTPUT
      -
        name: Build no-agent variant
        id: build
        uses: docker/build-push-action@v5
        with: 
          context: .
          platforms: linux/amd64
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: runtime
          tags: |
            contrastsecuritydemo/netflicks:latest-no-agent
      -
        name: Build image with Contrast agent
        id: build-contrast
        uses: docker/build-push-action@v5
        with: 
          context: .
          platforms: linux/amd64
          push: false
          load: true
          cache-from: type=gha
          target: runtime-with-contrast
          tags: |
            contrastsecuritydemo/netflicks:latest-with-agent
            contrastsecuritydemo/netflicks:latest-with-agent-${{ steps.meta.outputs.contrast_version }}


  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      -
        name: Checkout branch
        uses: actions/checkout@v4
      -
        name: Run docker-compose tests
        run: | 
          docker compose up -d 
      - 
        name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - 
        name: Install dependencies
        run: | 
          cd tests
          npm ci
          
      - 
        name: Install playwright browsers
        run: |
          cd tests
          npx playwright install --with-deps chromium
      - 
        name: Run Playwright tests
        run: |
          cd tests
          npx playwright test assess/*.spec.ts
      - 
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 30

  pre-merge:
    name: Prepare to merge
    runs-on: ubuntu-latest
    needs: 
      - test
    steps:              
      - name: Docker Metadata action
        id: metadata    
        uses: docker/metadata-action@v5
        with:
          images: contrastsecuritydemo/netflicks
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}, priority=100
            type=semver,pattern={{major}}.{{minor}}, priority=200
          
      - name: Version number 
        run: |
          echo Getting the build metadata
          echo $(echo ${{ steps.metadata.outputs.tags }})

