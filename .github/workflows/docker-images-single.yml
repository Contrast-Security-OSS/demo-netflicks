name: Docker Image CI

on:
  push:
    branches: 
      - main
    tags: 
      - v*
  pull_request:
    branches: 
      - main
  workflow_dispatch:
    inputs: 
      contrast_agent_version:
        description: 'Contrast .NET Core agent version to build with'
        required: false
        default: 'latest'

env:
  REGISTRY_IMAGE: contrastsecuritydemo/netflicks

jobs:
  prepare:
    name: Prepare for multi-stage builds
    runs-on: ubuntu-latest
    outputs:
      contrast_version: ${{ steps.versions.outputs.contrast_version }}
    steps:
      - name: Check latest Contrast agent version
        id: versions
        run: |
          docker pull contrast/contrast-dotnet-agent:${{ github.event.inputs.contrast_agent_version || 'latest' }}
          CONTRAST_VERSION=$(docker image inspect contrast/agent-dotnet-core:latest --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
          echo "Contrast agent version: ${CONTRAST_VERSION}"
          echo "contrast_version=${CONTRAST_VERSION}" >> $GITHUB_OUTPUT

       
  build:
    name: Build Docker Images
    needs: 
      - prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: runtime
          - name: runtime-with-contrast
          - name: tests
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      
      - name: Set up Docker daemon for multi-platform builds
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }
      
      - name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      
      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            - contrastsecuritydemo/netflicks
          flavor: |
            latest=false
            suffix=${{ matrix.image.name == 'runtime-with-contrast' && '-contrast' || null }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}.{{patch}},prefix=contrast,value=${{ needs.prepare.outputs.contrast_version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build all Docker images for this PR
        id: bake-pr
        uses: docker/bake-action@v6
        with:
          files: |
            docker-bake.hcl
          targets: |
            ${{ matrix.image.name }}
          push: false
          load: true
          set: |
            *.platform=linux/amd64
            *.platform=linux/arm64
 
      # - name: Run docker-compose tests
      #   run: | 
      #     docker compose --profile tests up --abort-on-container-exit --exit-code-from tests

      - name: Inspect the created images
        run: | 
          docker image ls -a 
        
      # docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.tags }}

      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
