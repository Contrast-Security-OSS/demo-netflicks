      #     files: |
      #       docker-bake.hcl
      #     targets: |
      #       multiarch
      #     push: false
      #     load: true
      #     set: | 
      #       *.platform=${{ matrix.platform }}
 
      # - name: Run docker-compose tests
      #   run: | 
      #     docker compose --profile tests up --abort-on-container-exit --exit-code-from tests 

      # - name: Extract metadata
      #   id: meta
      #   uses: docker/metadata-action@v5
      #   with:
      #     images: contrastsecuritydemo/netflicks
      #     tags: |
      #       type=ref,event=branch
      #       type=ref,event=pr
      #       type=semver,pattern={{version}}
      #       type=semver,pattern={{major}}.{{minor}}
      #       type=raw,value=latest,enable={{is_default_branch}}

      # - name: Get currently installed Contrast agent version
      #   id: versions
      #   run: | 
      #     docker compose up web-dev -d
      #     docker compose cp web-dev:/opt/contrast/image-manifest.json image-manifest.json
      #     CONTRAST_VERSION=$(cat image-manifest.json | jq -r '.version')
      #     echo "contrast_version=${CONTRAST_VERSION}" >> $GITHUB_OUTPUT
      #     docker compose down
      #     echo "Contrast agent version: ${CONTRAST_VERSION}"

      - name: Build all image variants with Docker Buildx Bake
        id: bake
        uses: docker/bake-action@v6
        with:
          files: |
            docker-bake.hcl
            cwd://${{ runner.temp }}/bake-meta.json
          targets: |
            runtime
          load: false
          set: | 
            *.platform=${{ matrix.platform }}
            *.output=type=image,push-by-digest=true,name-canonical=true,push=false

      - name: Export digest
        run: |
          echo "DIGEST METADATA"
          echo '${{ fromJSON(steps.bake.outputs.digest) }}'
          echo "IMAGE METADATA"
          echo '${{ fromJSON(steps.bake.outputs.metadata).image }}'
          echo "FULL METADATA"
          echo '${{ fromJSON(steps.bake.outputs.metadata) }}'

          
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ fromJSON(steps.bake.outputs.metadata).image['containerimage.digest'] }}"
          echo "digest=${digest}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  pre-merge:
    name: Prepare to merge
    runs-on: ubuntu-latest
    needs: 
      - build
    steps:              
      - name: Docker Metadata action
        id: metadata    
        uses: docker/metadata-action@v5
        with:
          images: contrastsecuritydemo/netflicks
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}, priority=100
            type=semver,pattern={{major}}.{{minor}}, priority=200
          
      - name: Version number 
        run: |
          echo Getting the build metadata
          echo ${{ needs.build.outputs.contrast_version }}

      - name: Download meta bake definition
        uses: actions/download-artifact@v4
        with:
          name: bake-meta
          path: ${{ runner.temp }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.target."docker-metadata-action".tags | map(select(startswith("${{ env.REGISTRY_IMAGE }}")) | "-t " + .) | join(" ")' ${{ runner.temp }}/bake-meta.json) \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:$(jq -r '.target."docker-metadata-action".args.DOCKER_META_VERSION' ${{ runner.temp }}/bake-meta.json)



