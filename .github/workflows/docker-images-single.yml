name: Docker Image CI

on:
  # push:
  #   branches: 
  #     - main
  #   tags: 
  #     - v*
  # pull_request:
  #   branches: 
  #     - main
  workflow_dispatch:

env:
  REGISTRY_IMAGE: contrastsecuritydemo/netflicks

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Create matrix
        id: platforms
        run: |
          echo "matrix=$(docker buildx bake runtime-multiarch --print | jq -cr '.target."runtime-multiarch".platforms')" >> ${GITHUB_OUTPUT}
          echo "matrix=$(docker buildx bake runtime-with-contrast-multiarch --print | jq -cr '.target."runtime-with-contrast-multiarch".platforms')" >> ${GITHUB_OUTPUT}
          echo "matrix=$(docker buildx bake tests-multiarch --print | jq -cr '.target."tests-multiarch".platforms')" >> ${GITHUB_OUTPUT}

      - name: Show matrix
        run: echo "${{ steps.platforms.outputs.matrix }}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
      
      - name: Rename meta bake definition file
        run: |
          mv "${{ steps.meta.outputs.bake-file }}" "${{ runner.temp }}/bake-meta.json"

      - name: Upload meta bake definition
        uses: actions/upload-artifact@v4
        with:
          name: bake-meta
          path: ${{ runner.temp }}/bake-meta.json
          if-no-files-found: error
          retention-days: 1
      
      
  build:
    name: Build Multi-Stage Docker Images
    runs-on: ubuntu-latest
    needs: 
      - prepare
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.prepare.outputs.matrix) }}
    # outputs:
    #   image-digest: ${{ steps.build.outputs.digest }}
    #   metadata: ${{ steps.meta.outputs.json }}
    #   contrast_version: ${{ steps.versions.outputs.contrast_version }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      
      - name: Download meta bake definition
        uses: actions/download-artifact@v4
        with:
          name: bake-meta
          path: ${{ runner.temp }}
      
      # - 
      #   name: Set up Docker daemon for multi-platform builds
      #   uses: docker/setup-docker-action@v4
      #   with:
      #     daemon-config: |
      #       {
      #         "debug": true,
      #         "features": {
      #           "containerd-snapshotter": true
      #         }
      #       }
      
      - name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      
      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: print the problem file
        run: |
          echo "bake-meta.json file: ${{ runner.temp }}/bake-meta.json"
          cat "${{ runner.temp }}/bake-meta.json"

      # Need to do two bake steps because load=true is not compatible with push-by-digest=true
      # https://github.com/moby/buildkit/issues/5556
      # - name: Build all image variants with Docker Buildx Bake (for local testing)
      #   id: bake-local
      #   uses: docker/bake-action@v6
