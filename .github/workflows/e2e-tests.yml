name: End-to-End Tests

on:
  push:
    branches: 
      - main
    tags: 
      - v*
  pull_request:
    branches: 
      - main
  workflow_dispatch:

env:
  REGISTRY_IMAGE: contrastsecuritydemo/netflicks

jobs:
  test: 
    name: Test Docker Images
    runs-on: ubuntu-latest
    env: 
      STAGING_IMAGE_RUNTIME: "ghcr.io/contrast-security-oss/demo-netflicks:pr-8-runtime"
      STAGING_IMAGE_RUNTIME_WITH_CONTRAST: "ghcr.io/contrast-security-oss/demo-netflicks:pr-8-runtime-with-contrast"
      STAGING_IMAGE_TESTS: "ghcr.io/contrast-security-oss/demo-netflicks:pr-8-tests"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Pull the staging docker images
        run: |
          echo "STAGING_IMAGE_RUNTIME=$STAGING_IMAGE_RUNTIME" > .env
          echo "STAGING_IMAGE_RUNTIME_WITH_CONTRAST=$STAGING_IMAGE_RUNTIME_WITH_CONTRAST" >> .env
          echo "STAGING_IMAGE_TESTS=$STAGING_IMAGE_TESTS" >> .env

          docker compose pull 

      - name: Run e2e tests with Playwright
        run: |
          echo "Running tests for the Docker images..."
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile tests up --abort-on-container-exit --exit-code-from tests

      - name: Save Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: /tests/playwright-report/
          retention-days: 7

      - name: Save Playwright test results
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: /tests/test-results/
          retention-days: 7

      - name: Generate Playwright test results summary
        uses: daun/playwright-report-summary@v3.9.0
        with: 
          report-file: /tests/test-results/results.json
          job-summary: true
